[package]
name = "fluxdl"
version = "0.4.1"
description = "FluxDL · 迅流下载器"
authors = ["FluxDL"]
edition = "2021"
rust-version = "1.77"

[workspace]

[lib]
name = "fluxdl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "process", "fs", "io-util", "net", "macros"] }
fluxdl-engine = { path = "../crates/download-engine" }
rfd = "0.15"
arboard = "3.4"
opener = "0.7"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
