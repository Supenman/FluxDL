<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap popup-desktop">
      <header class="head head-compact">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 100 100" fill="none">
            <rect class="icon-bg" width="100" height="100" rx="23" />
            <path class="icon-fill" d="M15 63 C8 46 19 35 45 34.8 L45 43.2 C27.5 44.5 19.5 52.5 19 60.5 C18 62.3 16.5 63.1 15 63 Z" />
            <path class="icon-fill" d="M55 34.8 C66.5 31 76 24 81 13 C79.5 28.5 70.5 39.5 55 43.2 Z" />
            <path class="icon-stroke" d="M50 19 L50 57" stroke-width="8.2" />
            <path class="icon-stroke" d="M35.5 45.5 L50 60.5 L64.5 45.5" stroke-width="8.2" />
            <path class="icon-stroke" d="M26 65.5 L26 70 Q26 75 31 75 L69 75 Q74 75 74 70 L74 65.5" stroke-width="7.6" />
          </svg>
        </div>
        <div class="titles">
          <h1>FluxDL 资源捕获</h1>
          <p id="status-text">正在检测桌面端…</p>
        </div>
        <span id="status-dot" class="dot pending"></span>
      </header>

      <!-- 客户端同款三段式顶部导航，告别一长条卡片堆砌 -->
      <nav class="popup-tabs" role="tablist" aria-label="扩展功能切换">
        <button type="button" role="tab" class="popup-tab active" data-tab="resources" aria-selected="true">
          本页资源 <b id="res-count">0</b>
        </button>
        <button type="button" role="tab" class="popup-tab" data-tab="images" aria-selected="false">
          批量抓图 <b id="img-count">0</b>
        </button>
        <button type="button" role="tab" class="popup-tab" data-tab="settings" aria-selected="false">
          设置
        </button>
      </nav>

      <!-- Tab 1: 本页资源与视频嗅探 -->
      <div class="tab-pane active" data-pane="resources">
        <section class="card video-card" id="video-card" hidden>
          <div class="copy">
            <span>本页检测到视频</span>
            <small id="video-tip">由桌面端 yt-dlp 解析清晰度并合并音视频</small>
          </div>
          <button id="parse-video" class="primary">下载本页视频</button>
        </section>

        <section class="card res-card">
          <div class="res-head">
            <div class="copy">
              <span>嗅探到的媒体与文件</span>
              <small>自动收集页面音视频、直链与压缩包</small>
            </div>
            <button id="clear-res" class="link">清空</button>
          </div>

          <div class="res-toolbar">
            <input id="res-search" class="res-search" type="search" placeholder="搜索名称或地址" autocomplete="off" />
            <div class="res-toolbar-row">
              <select id="res-filter" class="res-select" aria-label="按类型筛选">
                <option value="all">全部类型</option>
                <option value="视频">视频</option>
                <option value="音频">音频</option>
                <option value="压缩包">压缩包</option>
                <option value="安装包">安装包</option>
                <option value="文档">文档</option>
                <option value="文件">其它文件</option>
              </select>
              <select id="res-sort" class="res-select" aria-label="排序方式">
                <option value="recent">最新嗅探</option>
                <option value="size">体积从大到小</option>
                <option value="name">名称 A→Z</option>
              </select>
              <button id="res-select-all" class="res-mini" type="button">全选</button>
            </div>
          </div>

          <div id="res-list" class="res-list"></div>

          <div class="res-actions">
            <button id="res-download-selected" class="secondary" hidden>下载选中</button>
            <button id="res-copy-selected" class="secondary" hidden>复制直链</button>
            <button id="download-all" class="secondary" hidden>全部发送到 FluxDL</button>
          </div>
          <div id="res-summary" class="res-summary"></div>
        </section>
      </div>

      <!-- Tab 2: Fatkun 同款批量抓图与全屏画廊入口 -->
      <div class="tab-pane" data-pane="images">
        <section class="card gallery-entry-card">
          <div class="copy">
            <span>全屏批量抓图工作台</span>
            <small>内置 34 类站点高清原图规则、按宽高/格式筛选、原图灯箱、重命名与长图拼接</small>
          </div>
          <div class="gallery-entry-actions">
            <button id="open-gallery-current" class="primary" type="button">抓取当前页 → 画廊</button>
            <button id="open-gallery-all" class="secondary" type="button">抓取所有标签页</button>
          </div>
        </section>

        <section class="card img-card">
          <div class="res-head">
            <div class="copy">
              <span>弹窗快速抓图</span>
              <small>快速扫描当前页并一键发往 FluxDL</small>
            </div>
            <button id="scan-images" class="res-mini" type="button">扫描本页</button>
          </div>

          <div id="img-panel" hidden>
            <div class="res-toolbar-row img-toolbar">
              <select id="img-min-size" class="res-select" aria-label="最小像素过滤">
                <option value="120">≥ 120px</option>
                <option value="0">不限尺寸</option>
                <option value="300">≥ 300px</option>
                <option value="600">≥ 600px</option>
              </select>
              <button id="img-select-all" class="res-mini" type="button">全选</button>
              <button id="img-download" class="primary img-dl-btn" type="button" disabled>下载 (0)</button>
            </div>
            <div id="img-grid" class="img-grid"></div>
          </div>
        </section>
      </div>

      <!-- Tab 3: 设置 -->
      <div class="tab-pane" data-pane="settings">
        <section class="card">
          <div class="row">
            <div class="copy">
              <span>自动接管浏览器下载</span>
              <small>所有下载一律交给 FluxDL，不设类型或大小限制</small>
            </div>
            <label class="switch">
              <input id="auto-capture" type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>
          <div class="row row-sep">
            <div class="copy">
              <span>视频悬浮下载按钮</span>
              <small>鼠标悬停于网页播放器右上角时显示快捷下载胶囊</small>
            </div>
            <label class="switch">
              <input id="video-widget" type="checkbox" />
              <span class="slider"></span>
            </label>
          </div>
        </section>

        <section class="hint" id="hint">
          浏览页面时自动收集资源；也可在链接或视频上右键直接发送。
        </section>
      </div>

      <footer class="foot">
        <span>本地服务 127.0.0.1:35917</span>
        <button id="recheck" class="link">重新检测</button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
