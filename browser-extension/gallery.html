<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FluxDL 批量抓图工作台</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icons/32.png" alt="" width="24" height="24" />
        <div>
          <h1>FluxDL 批量抓图工作台</h1>
          <p id="summary-text">正在加载采集结果…</p>
        </div>
      </div>

      <div class="top-actions">
        <label class="rename-box" title="批量下载文件名模板">
          <span>命名</span>
          <select id="rename-tpl">
            <option value="orig">保持原名</option>
            <option value="index">纯序号 (001.jpg)</option>
            <option value="title_index">页标题 + 序号</option>
            <option value="dim_index">分辨率 + 序号</option>
          </select>
        </label>
        <label class="rename-box" title="打包 ZIP 时可顺手把 WEBP/AVIF 转成 JPG 或 PNG">
          <span>格式</span>
          <select id="export-fmt">
            <option value="orig">保持原格式</option>
            <option value="jpg">转 JPG</option>
            <option value="png">转 PNG</option>
          </select>
        </label>
        <button id="btn-export-txt" class="btn" type="button" disabled title="导出原图直链清单">导出链接</button>
        <button id="btn-stitch" class="btn" type="button" disabled title="将选中图片纵向拼接为一张长图">拼成长图</button>
        <button id="btn-zip" class="btn" type="button" disabled title="浏览器本地打包为单个 ZIP（支持格式转换）">打包 ZIP</button>
        <button id="btn-download" class="btn primary" type="button" disabled>发送到 FluxDL (0)</button>
      </div>
    </header>

    <section class="filterbar">
      <input id="f-query" class="f-input" type="search" placeholder="搜索文件名、域名或来源页…" />

      <select id="f-source" class="f-select" aria-label="来源标签页">
        <option value="all">全部来源页</option>
      </select>

      <label class="dim-box" title="最小宽度 / 最大宽度（留空不限）">
        <span>宽</span>
        <input id="f-min-w" type="number" min="0" step="50" value="120" placeholder="最小" />
        <span>–</span>
        <input id="f-max-w" type="number" min="0" step="50" placeholder="最大" />
      </label>

      <label class="dim-box" title="最小高度 / 最大高度（留空不限）">
        <span>高</span>
        <input id="f-min-h" type="number" min="0" step="50" value="120" placeholder="最小" />
        <span>–</span>
        <input id="f-max-h" type="number" min="0" step="50" placeholder="最大" />
      </label>

      <select id="f-ratio" class="f-select" aria-label="宽高比">
        <option value="all">全部比例</option>
        <option value="landscape">横图 (宽&gt;高)</option>
        <option value="portrait">竖图 (高&gt;宽)</option>
        <option value="square">方图 (≈1:1)</option>
      </select>

      <select id="f-ext" class="f-select" aria-label="图片格式">
        <option value="all">全部格式</option>
        <option value="jpg">JPG / JPEG</option>
        <option value="png">PNG</option>
        <option value="webp">WEBP</option>
        <option value="gif">GIF</option>
        <option value="avif">AVIF</option>
      </select>

      <select id="f-group" class="f-select" aria-label="分组方式">
        <option value="none">平铺显示</option>
        <option value="size">按尺寸分组</option>
        <option value="source">按来源页分组</option>
      </select>

      <select id="f-sort" class="f-select" aria-label="排序">
        <option value="area">分辨率从大到小</option>
        <option value="width">宽度从大到小</option>
        <option value="name">文件名 A→Z</option>
      </select>

      <label class="f-check">
        <input id="f-hd-only" type="checkbox" />
        <span>仅 HD</span>
      </label>

      <label class="f-check">
        <input id="f-hide-broken" type="checkbox" checked />
        <span>隐藏破图</span>
      </label>

      <label class="zoom-box" title="调整预览卡片大小">
        <span>缩放</span>
        <input id="f-zoom" type="range" min="130" max="340" step="10" value="192" />
      </label>

      <div class="f-right">
        <button id="btn-select-all" class="btn sm" type="button">全选</button>
        <button id="btn-invert" class="btn sm" type="button">反选</button>
        <button id="btn-clear-sel" class="btn sm" type="button">清空</button>
      </div>
    </section>

    <main id="grid" class="grid" aria-label="图片画廊"></main>

    <div id="toast" class="toast" hidden></div>

    <div id="lightbox" class="lightbox" hidden>
      <div class="lightbox-card">
        <div class="lightbox-head">
          <span id="lb-title" class="lb-title"></span>
          <div class="lb-actions">
            <button id="lb-prev" class="btn sm" type="button">← 上一张</button>
            <button id="lb-next" class="btn sm" type="button">下一张 →</button>
            <a id="lb-open" class="btn sm" target="_blank" rel="noreferrer">新标签打开</a>
            <button id="lb-send" class="btn sm primary" type="button">发往 FluxDL</button>
            <button id="lb-close" class="btn sm" type="button">关闭 (Esc)</button>
          </div>
        </div>
        <div class="lightbox-body">
          <img id="lb-img" alt="" referrerpolicy="no-referrer" />
        </div>
      </div>
    </div>

    <script src="gallery.js"></script>
  </body>
</html>
