[package]
name = "fluxdl-engine"
version = "0.4.3-beta.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "FluxDL download engine: multi-connection HTTP, resume, rate limiting, yt-dlp integration"

[dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
futures-util = "0.3"
url = "2"
percent-encoding = "2"
parking_lot = "0.12"
dirs = "5"
# 更新包完整性校验：下载的 exe / 工具包必须与发布清单里的 sha256 一致才允许替换，
# 否则回滚。纯 Rust 实现，无系统依赖。
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
tokio = { version = "1.42", features = ["full"] }
